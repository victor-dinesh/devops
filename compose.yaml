services:
  backend:
    build:
      context: ./backend
    image: autopipeline-backend:local
    container_name: autopipeline-backend
    restart: unless-stopped
    environment:
      APP_MODE: "demo"
      BACKEND_PORT: "8000"
      CORS_ORIGINS: "http://localhost:8082,http://localhost:5173,http://localhost:3000"
      JENKINS_URL: "http://host.docker.internal:8081"
    ports:
      - "8002:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "/"
    image: autopipeline-frontend:local
    container_name: autopipeline-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
  - "8082:8080"